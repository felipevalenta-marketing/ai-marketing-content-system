name: Release Readiness

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-validation:
    name: backend-validation
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
      API_DEBUG: "false"
      OPENAI_API_KEY: dummy_ci_key_do_not_use
      JWT_SECRET_KEY: dummy_ci_jwt_secret_for_tests_only
      ENABLE_AUTHENTICATION: "true"
      ENABLE_RBAC: "true"
      ENABLE_ANALYTICS: "true"
      ENABLE_OBSERVABILITY: "true"
      ENABLE_PERSISTENCE: "false"
      ENABLE_CI_SECURITY_CHECKS: "true"
      ENABLE_RELEASE_VALIDATION: "true"
      ENABLE_DOCKER_VALIDATION: "true"
      STORAGE_ROOT: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall src tests scripts
      - run: python -m pytest -p no:cacheprovider
      - run: python scripts/production_smoke.py

  frontend-validation:
    name: frontend-validation
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: python scripts/ci_frontend_check.py
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build

  docker-validation:
    name: docker-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/ci_docker_check.py
      - run: docker compose config
      - run: docker build -t ai-marketing-content-system:test .

  security-validation:
    name: security-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/ci_security_check.py

  pipeline-health:
    name: pipeline-health
    runs-on: ubuntu-latest
    needs:
      - backend-validation
      - frontend-validation
      - docker-validation
      - security-validation
    env:
      APP_ENV: ci
      API_DEBUG: "false"
      OPENAI_API_KEY: dummy_ci_key_do_not_use
      JWT_SECRET_KEY: dummy_ci_jwt_secret_for_tests_only
      ENABLE_AUTHENTICATION: "true"
      ENABLE_RBAC: "true"
      ENABLE_ANALYTICS: "true"
      ENABLE_OBSERVABILITY: "true"
      ENABLE_PERSISTENCE: "false"
      ENABLE_CI_SECURITY_CHECKS: "true"
      ENABLE_RELEASE_VALIDATION: "true"
      ENABLE_DOCKER_VALIDATION: "true"
      STORAGE_ROOT: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/ci_pipeline_health.py

  release-check:
    name: release-check
    runs-on: ubuntu-latest
    needs:
      - backend-validation
      - frontend-validation
      - docker-validation
      - security-validation
      - pipeline-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/ci_release_check.py
