services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_DEBUG: ${API_DEBUG:-false}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      STORAGE_ROOT: ${STORAGE_ROOT:-data}
      ENABLE_PERSISTENCE: ${ENABLE_PERSISTENCE:-true}
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-true}
      ENABLE_RBAC: ${ENABLE_RBAC:-true}
      ENABLE_AUTHENTICATION: ${ENABLE_AUTHENTICATION:-true}
      ENABLE_MULTI_BRAND_MANAGEMENT: ${ENABLE_MULTI_BRAND_MANAGEMENT:-true}
      ENABLE_WORKFLOW_ORCHESTRATION: ${ENABLE_WORKFLOW_ORCHESTRATION:-true}
      ENABLE_MARKDOWN_REPORTS: ${ENABLE_MARKDOWN_REPORTS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    volumes:
      - data:/app/data
      - outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data = json.loads(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read().decode()); raise SystemExit(0 if data.get('success') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend-build:
    image: node:20-slim
    working_dir: /app/frontend
    volumes:
      - .:/app
      - frontend-dist:/app/frontend/dist
    command: sh -c "npm install && npm run build"

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "5173:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  data:
  outputs:
  frontend-dist:
